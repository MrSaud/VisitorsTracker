# nginx in front of VisitorsTracker.
#
#   sudo cp deploy/nginx-visitorstracker.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Get a certificate first (certbot --nginx -d counter.example.com), and set
# DJANGO_BEHIND_TLS_PROXY=1 in /etc/visitorstracker.env so Django knows the
# connection it cannot see is encrypted.

upstream visitorstracker {
    server 127.0.0.1:8000;
    keepalive 4;
}

server {
    listen 80;
    server_name counter.example.com;
    # certbot replaces this with a redirect to 443 when it issues the cert.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name counter.example.com;

    ssl_certificate     /etc/letsencrypt/live/counter.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/counter.example.com/privkey.pem;

    # The dashboard shows a camera's live view. Keep it off the record.
    access_log /var/log/nginx/visitorstracker.access.log;
    error_log  /var/log/nginx/visitorstracker.error.log;

    client_max_body_size 4m;

    location / {
        proxy_pass http://visitorstracker;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # The MJPEG live view is one response that never ends. Buffering it would
    # hold frames back until the buffer filled, so the picture would arrive
    # in jerks, minutes late; the read timeout would also cut it.
    location ~ ^/api/v1/cameras/[0-9]+/stream/$ {
        proxy_pass http://visitorstracker;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }
}
